name: Android ARMv7

on:
  workflow_dispatch:

jobs:
  build-android-armv7:
    name: Build Android armeabi-v7a
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch Aurora for 32-bit narrowing
        run: |
          sed -i 's/ByteBuffer data{size};/ByteBuffer data{static_cast<size_t>(size)};/' extern/aurora/lib/gfx/texture_replacement.cpp
          sed -i 's/ByteBuffer blob{n};/ByteBuffer blob{static_cast<size_t>(n)};/' extern/aurora/lib/gfx/texture_replacement.cpp

      - name: Patch endian + mod ABI for 32-bit ARM
        run: |
          sed -i 's/defined(__aarch64__) || defined(_M_X64)/defined(__aarch64__) || defined(__arm__) || defined(_M_X64)/' include/helpers/endian.h
          sed -i 's/static_assert(sizeof(ModMetaHookFn) == 24);/#if DUSK_CODE_MODS\nstatic_assert(sizeof(ModMetaHookFn) == 24);\n#endif/' sdk/include/mods/api.h
          sed -i 's/static_assert(sizeof(ModMetaHookMemExt) == 24);/#if DUSK_CODE_MODS\nstatic_assert(sizeof(ModMetaHookMemExt) == 24);\n#endif/' sdk/include/mods/api.h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Rust
        run: |
          rustup toolchain install stable
          rustup target add armv7-linux-androideabi

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset x-android-ci-armv7 -DPROTOC_EXECUTABLE=$(which protoc) -DDUSK_ENABLE_CODE_MODS=OFF -DDAWN_ENABLE_VULKAN=OFF

      - name: Build Dusklight
        run: cmake --build --preset x-android-ci-armv7 --target dusklight

      - name: Build bundled mods
        run: cmake --build --preset x-android-ci-armv7 --target dusklight_mods

      - name: Build APK
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --rerun-tasks

      - name: Show generated APKs
        run: |
          find platforms/android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-android-armeabi-v7a
          path: platforms/android/app/build/outputs/apk/release/*.apk
